# Kafka topics as code (Stage 3 design). apply_topics.sh makes MSK match this file.
# Partitions can only go up. Replication factor can't be changed in place.
#
# Every topic also gets these (set in apply_topics.sh, COMMON_CONFIGS):
#   unclean.leader.election.enable=false   never let a stale replica become leader (zero data loss)
#   message.timestamp.type=LogAppendTime    Kafka timestamp = broker arrival time (trusted ingest_time)
#   segment.ms=86400000                     close a segment daily, so retention is ~exact even at low volume
#
# name           partitions  replication  retention_ms   min_insync
gps_pings        6           3            259200000      2
ride_events      6           3            604800000      2
